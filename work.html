<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work — Yiting Zhong</title>
<meta name="description" content="Selected work in planning, architecture and research by Yiting Zhong.">
<style>@view-transition { navigation: auto; }</style>
<link rel="stylesheet" href="assets/css/site.css">
<style>
  .wrap { padding: 44px var(--pad) 120px; position: relative; z-index: 2; }
  .tools { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }

  /* ---- List: three columns of small text blocks ---- */
  .txt { display: grid; grid-template-columns: repeat(3, 1fr); gap: 86px 28px; }
  .item { position: relative; display: block; min-height: 84px; padding-right: 20px; font-size: 15px; line-height: 1.3; transition: opacity .3s; }
  .item h3 { font-size: 17px; font-weight: 600; letter-spacing: -.01em; display: inline; text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 3px; transition: color .2s; }
  .item p { color: var(--muted); margin-top: 1px; width: fit-content; }
  .item h3 + p { margin-top: 6px; }
  .item:hover h3, .item:focus-visible h3 { color: var(--ink-c); }
  .txt.hovering .item { opacity: .14; }
  .txt.hovering .item.hot { opacity: 1; }
  .txt.hovering .item.hot h3, .txt.hovering .item.hot p { background: var(--bg); box-shadow: 0 0 0 2px var(--bg); }
  .gone { display: none !important; }

  /* Hover stage: fixed below the toolbar, behind the text. Nothing follows the cursor. */
  .stage { position: fixed; left: 0; right: 0; top: 150px; bottom: 20px; z-index: 1; pointer-events: none; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .peek { position: relative; flex: none; width: min(40vw, 520px, calc((100vh - 330px) * 1.333)); aspect-ratio: 4/3; opacity: 0; transition: opacity .3s; overflow: hidden; border-radius: 4px; }
  .peek.on { opacity: 1; }
  .peek > div { position: absolute; inset: 0; opacity: 0; transition: opacity .3s; }
  .peek > div.on { opacity: 1; }
  .big { text-align: center; padding: 14px var(--pad) 0; max-width: 34em; opacity: 0; transition: opacity .3s; background: var(--bg); box-shadow: 0 14px 10px 8px var(--bg); margin-top: 10px; }
  .big.on { opacity: 1; }
  .big span { display: block; margin-bottom: 4px; font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
  .big b { display: block; font-size: clamp(24px, 2.6vw, 36px); font-weight: 600; letter-spacing: -.03em; line-height: 1.05; }
  .big p { margin-top: 8px; font-size: 13px; line-height: 1.45; color: var(--muted); }

  /* ---- Grid: an uneven, editorial layout ---- */
  .img { display: none; grid-template-columns: repeat(12, 1fr); gap: 70px 28px; align-items: start; }
  body.as-grid .img { display: grid; }
  body.as-grid .txt, body.as-grid .stage { display: none; }
  .piece { display: block; }
  /* Coming-soon slots: not links, so no underline and no pointer. */
  .item.soon h3 { text-decoration: none; color: var(--muted); font-weight: 500; }
  .item.soon, .piece.soon { cursor: default; }
  .piece .pic { position: relative; overflow: hidden; border-radius: 4px; }
  .piece .pic > div { position: absolute; inset: 0; transition: opacity .5s; }
  .piece .pic .col { opacity: 0; }
  .piece:hover .pic .col, .piece:focus-visible .pic .col { opacity: 1; }
  .piece h3 { font-size: 15px; font-weight: 600; display: inline; text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 3px; }
  .piece .cap { margin-top: 10px; font-size: 13px; line-height: 1.35; }
  .piece .cap p { color: var(--muted); }

  @media (max-width: 1000px) { .txt { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 720px) {
    .wrap { padding: 28px var(--pad) 100px; }
    .stage { display: none; }
    .txt { grid-template-columns: 1fr; gap: 44px; }
    .img { grid-template-columns: 1fr; gap: 40px; }
    .piece { grid-column: auto !important; margin-top: 0 !important; }
  }
</style>
</head>
<body data-page="work">
<header data-site-header></header>
<div class="pagehead">
  <div class="left"><h1>Work</h1><span class="count" id="count"></span></div>
  <div class="tools">
    <div class="filters" id="filters"></div>
    <div class="switch" id="view" role="group" aria-label="View"><button type="button" data-v="list" class="on">List</button><button type="button" data-v="grid">Grid</button></div>
  </div>
</div>
<div class="stage" aria-hidden="true"><div class="peek" id="peek"></div><div class="big" id="big"></div></div>
<main class="wrap">
  <div class="txt" id="txt"></div>
  <div class="img" id="img"></div>
</main>
<footer data-site-footer></footer>

<script src="assets/js/data.js"></script>
<script src="assets/js/site.js"></script>
<script>
const LIST = [...newestFirst(live().filter((p) => !soon(p))), ...live().filter(soon)];   // real projects first, then the coming-soon slots
// Grid: each piece gets a column span, a shape and a vertical nudge, so the page reads like a spread rather than a table.
const LAYOUT = [["1 / span 7", "16/10", 0], ["9 / span 4", "4/5", 90], ["2 / span 4", "1/1", 0], ["7 / span 6", "16/10", 60], ["1 / span 5", "4/5", 0], ["7 / span 5", "4/3", 130], ["3 / span 8", "16/9", 0], ["1 / span 4", "1/1", 0], ["6 / span 7", "16/10", 80], ["4 / span 5", "4/5", 0]];

const txt = document.getElementById("txt"), img = document.getElementById("img"), peek = document.getElementById("peek"), big = document.getElementById("big");
LIST.forEach((P, n) => {
  const L = LAYOUT[n % LAYOUT.length];
  if (soon(P)) {
    txt.insertAdjacentHTML("beforeend", `<div class="item soon" data-cat="soon" tabindex="0"><h3>${SOON.title}</h3><p></p><p></p><p class="mono"></p></div>`);
    peek.insertAdjacentHTML("beforeend", `<div>${colourHTML(P)}</div>`);
    img.insertAdjacentHTML("beforeend", `<div class="piece soon" data-cat="soon" style="grid-column:${L[0]};margin-top:${L[2]}px"><div class="pic" style="aspect-ratio:${L[1]}"><div>${coverHTML(P)}</div><div class="col">${colourHTML(P)}</div></div><div class="cap"><h3>${SOON.title}</h3></div></div>`);
    return;
  }
  const kind = `${CATS[P.cat]} · ${P.kind}`;
  txt.insertAdjacentHTML("beforeend", `<a class="item" data-cat="${P.cat}" href="${projectUrl(P)}" style="--ink-c:${P.ink}"><h3>${P.title}</h3><p>${kind}</p><p>${P.role}</p><p class="mono">${prettyDate(P)}</p></a>`);
  peek.insertAdjacentHTML("beforeend", `<div>${colourHTML(P)}</div>`);
  img.insertAdjacentHTML("beforeend", `<a class="piece" data-cat="${P.cat}" href="${projectUrl(P)}" style="grid-column:${L[0]};margin-top:${L[2]}px"><div class="pic" style="aspect-ratio:${L[1]}"><div>${coverHTML(P)}</div><div class="col">${colourHTML(P)}</div></div><div class="cap"><h3>${P.title}</h3><p>${kind}</p><p class="mono">${prettyDate(P)}</p></div></a>`);
});

// List hover: the others fade back, and this project's image and introduction appear in the middle of the window.
const items = [...txt.children], peeks = [...peek.children];
const calm = () => { txt.classList.remove("hovering"); peek.classList.remove("on"); big.classList.remove("on"); };
items.forEach((el, n) => {
  const show = () => {
    const P = LIST[n];
    txt.classList.add("hovering");
    items.forEach((x) => x.classList.toggle("hot", x === el));
    peeks.forEach((x, m) => x.classList.toggle("on", m === n));
    big.innerHTML = soon(P) ? `<b>${SOON.title}</b><p>${SOON.blurb}</p>` : `<span>${CATS[P.cat]} · ${year(P)}</span><b>${P.title}</b><p>${P.blurb}</p>`;
    peek.classList.add("on"); big.classList.add("on");
  };
  el.addEventListener("mouseenter", show);
  el.addEventListener("focus", show);
  el.addEventListener("mouseleave", calm);
  el.addEventListener("blur", calm);
});

function apply() {
  const f = currentFilter();
  let shown = 0;
  [...items, ...img.children].forEach((el) => el.classList.toggle("gone", f !== "all" && el.dataset.cat !== f));
  items.forEach((el) => !el.classList.contains("gone") && !el.classList.contains("soon") && shown++);
  document.getElementById("count").textContent = `${shown} project${shown === 1 ? "" : "s"}`;
}
buildFilters(document.getElementById("filters"), apply);
apply();

// Shared-image transition: the clicked picture grows into the project page's big image,
// and on the way back the big image shrinks into the same picture here.
const picFor = (n) => (document.body.classList.contains("as-grid") ? img.children[n].querySelector(".pic") : peek);
const slugAt = (href) => LIST.findIndex((P) => !soon(P) && new URL(projectUrl(P)).pathname === new URL(href, location.href).pathname);
let named = null;
const nameIt = (el) => { if (named) named.style.viewTransitionName = ""; named = el; if (el) el.style.viewTransitionName = "hero"; };
addEventListener("pageswap", (e) => {
  const to = e.activation && e.activation.entry && e.activation.entry.url, n = to ? slugAt(to) : -1;
  nameIt(n >= 0 ? picFor(n) : null);
});
addEventListener("pagereveal", (e) => {
  if (!e.viewTransition) return;
  const from = navigation.activation && navigation.activation.from && navigation.activation.from.url, n = from ? slugAt(from) : -1;
  if (n < 0) return;
  if (!document.body.classList.contains("as-grid")) { peeks.forEach((x, m) => x.classList.toggle("on", m === n)); peek.classList.add("on"); }
  nameIt(picFor(n));
  e.viewTransition.finished.finally(() => { nameIt(null); calm(); });
});

// List / Grid, remembered in the URL too: work.html?view=grid
const view = document.getElementById("view");
function setView(v) {
  document.body.classList.toggle("as-grid", v === "grid");
  view.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.v === v));
  calm();
}
view.addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  const u = new URL(location.href);
  b.dataset.v === "grid" ? u.searchParams.set("view", "grid") : u.searchParams.delete("view");
  history.replaceState(null, "", u);
  setView(b.dataset.v);
});
setView(new URLSearchParams(location.search).get("view") === "grid" ? "grid" : "list");
</script>
</body>
</html>
