<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yiting Zhong</title>
<meta name="description" content="Yiting Zhong — city planning, spatial data and design.">
<link rel="stylesheet" href="assets/css/site.css">
<style>
  .stage { position: sticky; top: 0; height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
  .scene { position: relative; flex: 1; min-height: 0; }
  .card, .hit { --h: clamp(120px, 25vh, 230px); position: absolute; left: 0; top: 0; width: var(--h); height: var(--h); margin: calc(var(--h) * -.5) 0 0 calc(var(--h) * -.5); border-radius: 12px; }
  .card { will-change: transform; overflow: hidden; pointer-events: none; }
  .hit { cursor: pointer; }
  .hello { position: absolute; left: var(--pad); top: 10px; z-index: 1; pointer-events: none; transition: opacity .4s; }
  .hello.dim { opacity: .12; }
  .hello h1 { font-size: clamp(28px, 4vw, 56px); font-weight: 500; letter-spacing: -.04em; line-height: 1; max-width: 9em; }
  .hello p { color: var(--muted); margin-top: 12px; }
  /* Project info travels with the lifted card and sits in the gap its neighbours open up. */
  .note { position: absolute; left: 0; top: 0; width: 250px; z-index: 1500; pointer-events: none; }
  .note > * { opacity: 0; transform: translateY(8px); transition: opacity .12s, transform .12s; }
  .note.on > * { opacity: 1; transform: none; transition: opacity .32s ease-out, transform .38s ease-out; }
  .note.on > *:nth-child(1) { transition-delay: .06s; } .note.on > *:nth-child(2) { transition-delay: .1s; } .note.on > *:nth-child(3) { transition-delay: .14s; }
  .note.right { text-align: right; }
  .note .k { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
  .note h3 { font-size: 24px; font-weight: 500; letter-spacing: -.03em; line-height: 1.05; margin: 5px 0 8px; }
  .note .b { font-size: 13px; line-height: 1.45; color: var(--muted); }
  /* A soft white pad under the text, so it stays readable when it lands over the cards below. */
  .note > * { position: relative; }
  .note::before { content: ""; position: absolute; inset: -14px -16px; background: var(--bg); border-radius: 14px; box-shadow: 0 0 22px 14px var(--bg); opacity: 0; transition: opacity .25s; }
  .note.on::before { opacity: .94; }
  .after { padding: 80px var(--pad) 120px; border-top: 1px solid var(--ink); background: var(--bg); position: relative; z-index: 2; }
  .after a { display: flex; justify-content: space-between; font-size: clamp(28px, 5vw, 64px); font-weight: 500; letter-spacing: -.04em; padding: 14px 0; border-bottom: 1px solid var(--ink); transition: padding .3s var(--ease); }
  .after a:hover { padding-left: 16px; }

  /* Fixed header so the opening's big name can fly into it. */
  [data-site-header] { position: fixed; top: 0; left: 0; right: 0; background: var(--bg); z-index: 3000; }
  .stage { padding-top: 60px; }

  /* ---- Opening: a scroll-driven parallax. Each layer moves at its own speed. ---- */
  .op-track { height: 320vh; position: relative; z-index: 2; pointer-events: none; }
  /* The ribbon slides under the opening's last two screens, so the covers can land on it. */
  #track { position: relative; z-index: 1; margin-top: -200vh; margin-top: -200dvh; }
  .op-stage { position: sticky; top: 0; height: 100vh; height: 100dvh; overflow: hidden; }
  .op-layer { position: absolute; inset: 0; will-change: transform; pointer-events: none; }
  .op-layer.far svg { position: absolute; left: -10%; top: -20%; width: 120%; height: 160%; }
  .op-layer.far path, .op-layer.far rect { fill: none; stroke: #d9d6cf; stroke-width: 1; }
  .op-name { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #mid { z-index: 30; }
  .op-big { font-size: clamp(64px, 13vw, 220px); font-weight: 500; letter-spacing: -.05em; line-height: .9; white-space: nowrap; }
  .op-name p:not(.op-big) { margin-top: 18px; font-size: 16px; color: var(--muted); }
  .cov { position: absolute; border-radius: 12px; overflow: hidden; box-shadow: 0 20px 40px -24px rgba(0,0,0,.35); }
  .doo { position: absolute; overflow: visible; }
  .doo * { fill: none; stroke: var(--ink); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .doo g { filter: url(#boil); }
  .notes span { position: absolute; font: 12px/1 ui-monospace, Consolas, monospace; color: #9a978f; letter-spacing: .02em; }
  .route { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; filter: url(#boil); }
  .route path { fill: none; stroke: var(--ink); stroke-width: 1.6; stroke-dasharray: .006 .008; stroke-linecap: round; }
  .hint { position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); font-size: 13px; color: var(--muted); transition: opacity .3s; }
  @media (max-width: 720px) { .doo { scale: .7; } .notes span { font-size: 10px; } }
  @media (prefers-reduced-motion: reduce) { .op-track { display: none; } .doo g, .route { filter: none; } }
  @media (max-width: 720px) { .hello p { display: none; } .card, .hit { --h: clamp(92px, 28vw, 140px); } .note { width: 200px; } }
</style>
</head>
<body data-page="home">

      <svg class="doo" style="left:88%;top:30%;width:70px" viewBox="0 0 100 100" aria-hidden="true"><g><circle cx="50" cy="56" r="30"/><path d="M28 44 C44 58 60 38 76 52 M26 64 C44 80 62 58 78 72 M40 30 C48 50 56 70 62 86 M58 26 L82 6"/></g></svg>
      <svg class="doo" style="left:52%;top:30%;width:44px" viewBox="0 0 60 80" aria-hidden="true"><g><path d="M30 74 C14 52 8 40 8 28 C8 14 18 6 30 6 C42 6 52 14 52 28 C52 40 46 52 30 74 Z"/><circle cx="30" cy="28" r="8"/></g></svg>
      <svg class="doo" style="left:6%;top:40%;width:70px" viewBox="0 0 100 120" aria-hidden="true"><g><path d="M50 112 L50 66 M50 78 L34 62 M50 70 L66 56"/><path d="M50 10 C26 10 14 30 22 48 C12 62 26 78 44 72 C56 82 76 74 76 58 C90 50 86 26 70 22 C66 12 58 10 50 10 Z"/></g></svg>

      <svg class="doo" style="left:60%;top:88%;width:120px" viewBox="0 0 160 90" aria-hidden="true"><g><rect x="10" y="14" width="140" height="52" rx="10"/><path d="M10 40 L150 40 M40 14 L40 40 M70 14 L70 40 M100 14 L100 40 M130 14 L130 40"/><circle cx="40" cy="72" r="10"/><circle cx="122" cy="72" r="10"/></g></svg>

    <div class="op-layer" id="near"></div>
    <p class="hint" id="hint">Scroll</p>

</div>
<div id="track">
  <div class="stage">
    <div class="scene" id="scene">
      <div class="note" id="note" aria-live="polite"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/site.js"></script>
<script>
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
let RIB = null, morph = 0;   // ribbon card spots (filled by the ribbon), and how far the covers have landed
const opStage = document.getElementById("opStage"), opening = document.getElementById("opening"), near = document.getElementById("near");
const OPLIST = live();
// Scattered covers: x, y (fraction of the screen), size (px), depth (how fast it moves), turn (degrees over the whole scroll)
const SCATTER = [[.92,.9,90,1.8,8],[.15,.3,80,2.2,-14],[.55,.2,120,1.35,9],[.06,.62,170,1.3,-8],[.22,.86,120,1.7,6],[.78,.18,150,1.1,10],[.86,.44,110,1.6,-12],[.62,.78,190,1.45,5],[.38,.08,100,1.9,-6],[.03,.12,130,1.2,12],[.48,.58,90,2.1,-10]];
const covs = SCATTER.map(([x, y, s, depth, turn], i) => {
  const P = OPLIST[i % OPLIST.length];
  const el = document.createElement("div");
  el.className = "cov"; el.style.width = el.style.height = s + "px";
  el.innerHTML = coverHTML(P);
  near.appendChild(el);
  return { el, x, y, s, depth, turn, i };
});
const layers = [...opStage.querySelectorAll(".op-layer[data-depth]")].map((el) => ({ el, d: +el.dataset.depth }));
const name = document.getElementById("name"), hint = document.getElementById("hint"), route = document.getElementById("route");
// Mouse position, -1 … 1 from the centre, eased so layers drift rather than jump.
let mx = 0, my = 0, tmx = 0, tmy = 0;
addEventListener("mousemove", (e) => { tmx = e.clientX / innerWidth * 2 - 1; tmy = e.clientY / innerHeight * 2 - 1; });
requestAnimationFrame(function follow() { mx += (tmx - mx) * 0.06; my += (tmy - my) * 0.06; drawOpening(); requestAnimationFrame(follow); });
const ease = (t) => t * t * (3 - 2 * t);

function drawOpening() {
  const W = opStage.clientWidth, H = opStage.clientHeight, sc = clamp(W / 1300, 0.55, 1);
  const total = opening.offsetHeight - H, p = clamp(scrollY / total, 0, 1);   // 0 → 1 across the opening
  // Far and middle layers drift up at their own speed.
  layers.forEach(({ el, d }) => (el.style.transform = `translate(${mx * d * 18}px, ${-p * H * d + my * d * 12}px)`));
    // The big name shrinks and flies into the header, where it hands over to the real header name.
  const k = ease(clamp(p / 0.7, 0, 1));
  const big = name.querySelector(".op-big"), hn = document.querySelector(".top .name");
  const hr = hn.getBoundingClientRect(), nw = big.offsetWidth, nh = name.offsetHeight;
  const s1 = parseFloat(getComputedStyle(hn).fontSize) / parseFloat(getComputedStyle(big).fontSize);
  const s = 1 + (s1 - 1) * k;
  const x0 = (W - nw) / 2, y0 = (H - nh) / 2;
  name.style.transform = `translate(${x0 + (hr.left - x0) * k}px, ${y0 + (hr.top - y0) * k}px) scale(${s})`;
  name.querySelector("p:not(.op-big)").style.opacity = 1 - clamp(k / 0.3, 0, 1);
  name.style.opacity = 1 - clamp((k - 0.88) / 0.12, 0, 1);
  hn.style.opacity = p < 0.01 ? 0 : clamp((k - 0.85) / 0.15, 0, 1);
  // The whole opening fades as it ends, so the ribbon takes over cleanly.
  // Everything else in the opening fades while the covers settle onto the ribbon.
  const fade = String(1 - ease(clamp((p - 0.6) / 0.32, 0, 1)));
  ["far", "notes", "doodles"].forEach((id) => (document.getElementById(id).style.opacity = fade));
  route.style.opacity = fade;
  opStage.style.visibility = p >= 1 ? "hidden" : "";
  // Near covers fly past, then each one lands on its own card in the ribbon underneath.
  const g = ease(clamp((p - 0.62) / 0.36, 0, 1));
  morph = p >= 1 ? 1 : ease(clamp((g - 0.72) / 0.28, 0, 1)) * 0.999;   // the other cards only fade in as the covers arrive
  near.style.transform = `translate(${mx * 26 * (1 - g)}px, ${my * 16 * (1 - g)}px)`;
  covs.forEach((c, i) => {
    // Covers loop round (leaving at the top, coming back from the bottom), so when the landing starts they are spread over the screen.
    const fy = c.extra ? c.y * H : ((((c.y - Math.min(p, 0.62) * c.depth + 0.3) % 1.5) + 1.5) % 1.5 - 0.3) * H, fx = c.x * W;
    const t = RIB && RIB.spots[c.k];
    const h = t ? RIB.size : Math.min(W, H) * 0.2;
    const tx = t ? RIB.left + t.x - h / 2 : W * 0.5, ty = t ? RIB.top + t.y - h / 2 : H * 0.7;
    const size = c.s * sc + (h - c.s * sc) * g;
    const x = fx + (tx - fx) * g, y = fy + (ty - fy) * g;
    c.el.style.width = c.el.style.height = size + "px";
    c.el.style.transform = `translate(${x}px, ${y}px) rotate(${c.turn * p * (1 - g)}deg) skewY(${14 * g}deg) scaleX(${1 - 0.1 * g})`;
    c.el.style.zIndex = g > 0.5 && t ? t.z : Math.round(c.depth * 10);
    c.el.style.opacity = (c.extra && g === 0) || p >= 1 ? 0 : (t ? 1 - (1 - t.o) * g : 1);
  });
  hint.style.opacity = p > 0.03 ? 0 : 1;
  // The dashed route is revealed as you scroll.
  route.style.clipPath = `inset(0 ${100 - clamp(p / 0.8, 0, 1) * 100}% 0 0)`;
}
addEventListener("scroll", () => requestAnimationFrame(drawOpening), { passive: true });
addEventListener("resize", drawOpening);
drawOpening();

// Doodles keep the hand-drawn jitter.
const boilN = document.getElementById("boilNoise"); let sd = 1;
setInterval(() => { sd = (sd % 4) + 1; boilN.setAttribute("seed", sd); }, 130);

document.getElementById("tagline").textContent = SITE.tagline;
document.getElementById("intro").textContent = SITE.intro;

const LIST = live(), N = LIST.length;
const scene = document.getElementById("scene"), track = document.getElementById("track");
const M = N * Math.ceil(Math.max(20, N * 2) / N);  // enough cards for a full looping ribbon; a multiple of N so each card keeps its project
// Each opening cover lands on a card showing the same project, spread from just behind the front of the ribbon.
const back = N * Math.ceil(3 / N);
covs.forEach((c) => (c.k = (((c.i - back) % M) + M) % M));
// Every other card in the ribbon gets a cover too; these wait just off screen and fly in for the landing.
const taken = new Set(covs.map((c) => c.k));
for (let k = 0; k < M; k++) {
  if (taken.has(k)) continue;
  const el = document.createElement("div");
  el.className = "cov"; el.innerHTML = coverHTML(LIST[k % N]);
  near.appendChild(el);
  const side = k % 4, r = Math.random();                       // top, right, bottom, left
  covs.push({ el, k, extra: true, s: 120, depth: 1, turn: (Math.random() - 0.5) * 40,
    x: side === 1 ? 1.15 : side === 3 ? -0.25 : r, y: side === 0 ? -0.3 : side === 2 ? 1.15 : r });
}
const landed = new Set(covs.map((c) => c.k));
for (let k = 0; k < M; k++) {
  const P = LIST[k % N];
  scene.insertAdjacentHTML("beforeend", soon(P)
    ? `<div class="card">${coverHTML(P)}</div><div class="hit soon" tabindex="0" aria-label="${SOON.title}"></div>`
    : `<div class="card">${coverHTML(P)}</div><a class="hit" href="${projectUrl(P)}" aria-label="${P.title}"></a>`);
}
// The pointer is tested against `hits`, which stay in the row, so a card that lifts away never loses its own hover.
const cards = [...scene.querySelectorAll(".card")], hits = [...scene.querySelectorAll(".hit")];
const pop = new Array(M).fill(0), push = new Array(M).fill(0);
let hover = -1, drift = 0, last = performance.now();

// Every card leans the same way while the row climbs to the right, so each sits partly behind the one before it.
const FACE = 14, SQUASH = 0.9, ROW = -12 * Math.PI / 180;
const note = document.getElementById("note"), hello = document.querySelector(".hello");
let shownFor = -1, noteT;

function frame(now) {
  const dt = Math.min(64, now - last); last = now;
  const W = scene.clientWidth, H = scene.clientHeight, size = cards[0].offsetHeight;
  const gap = size * 0.5, dx = Math.cos(ROW) * gap, dy = Math.sin(ROW) * gap;
  const ax = W * 0.46, ay = H * 0.7;
  if (hover < 0) drift += dt * 0.0001;                            // slow drift when nobody is touching it
  const pos = Math.max(0, scrollY - (opening.offsetHeight - innerHeight)) / (gap * 1.6) + drift;
  const sr = scene.getBoundingClientRect();
  RIB = { left: sr.left, top: sr.top, size, spots: [] };
  hello.style.opacity = morph < 1 ? morph : "";

  cards.forEach((el, k) => {
    let d = k - pos;
    d -= Math.round(d / M) * M;                                   // wrap around
    pop[k] += ((k === hover ? 1 : 0) - pop[k]) * 0.075;           // eases straight to its target: no bounce
    const p = pop[k];
    // The cards in front of the hovered one bunch up toward the viewer, opening a gap for it.
    let want = 0;
    if (hover >= 0 && k !== hover) {
      let rel = k - hover; rel -= Math.round(rel / M) * M;
      if (rel < 0) want = -0.95 * Math.exp((rel + 1) * 0.55);
    }
    push[k] += (want - push[k]) * 0.075;
    const u = d + push[k];
    // A pronounced curve: almost level near the viewer, sweeping upward as it recedes.
    const x = ax + u * dx, y = ay + u * dy - size * (u > 0 ? 0.024 : 0.0065) * u * u;
    const rise = Math.min(size * 0.85, Math.max(0, y - size * 0.5 - 10));
    const rest = `translate(${x}px, ${y}px)`;
    // Hover: the card rises straight up and turns to face you.
    el.style.transform = `${rest} translateY(${-rise * p}px) skewY(${FACE * (1 - p)}deg) scaleX(${SQUASH + (1 - SQUASH) * p})`;
    el.style.zIndex = 200 - Math.round(d * 4);
    // Cards that a cover is landing on appear only once it has arrived; the rest fade in on the spot.
    el.style.opacity = clamp(M / 2 - 0.6 - Math.abs(d), 0, 1) * (landed.has(k) ? (morph >= 1 ? 1 : 0) : morph);
    RIB.spots[k] = { x: x, y: y, z: 200 - Math.round(d * 4), o: clamp(M / 2 - 0.6 - Math.abs(d), 0, 1) };
    hits[k].style.transform = `${rest} skewY(${FACE}deg) scaleX(${SQUASH})`;
    hits[k].style.zIndex = 1000 - Math.round(d * 4);
    hits[k].style.display = Math.abs(d) < M / 2 - 1 ? "" : "none";
    if (k === shownFor) {
      const top = y - size * 0.5 - rise, nw = note.offsetWidth, room = x - size / 2 - 22 - nw, beside = room > 14;
      note.classList.toggle("right", beside);
      const nx = Math.min(W - nw - 14, beside ? room : Math.max(14, x - size / 2)), ny = beside ? top + 4 : top - note.offsetHeight - 14;
      note.style.transform = `translate(${nx}px, ${ny}px)`;
      const h = hello.getBoundingClientRect(), s = scene.getBoundingClientRect();
      hello.classList.toggle("dim", note.classList.contains("on") && nx < h.right - s.left + 10 && ny < h.bottom - s.top + 10);
    }
  });
  requestAnimationFrame(frame);
}

// The info fades out fast, then fades in line by line beside whichever card is now lifted.
function showNote(k) {
  clearTimeout(noteT);
  note.classList.remove("on");
  if (k < 0) { noteT = setTimeout(() => { shownFor = -1; hello.classList.remove("dim"); }, 200); return; }
  noteT = setTimeout(() => {
    const P = LIST[k % N];
    note.innerHTML = soon(P) ? `<h3>${SOON.title}</h3><p class="b">${SOON.blurb}</p>` : `<p class="k">${CATS[P.cat]} · ${year(P)}</p><h3>${P.title}</h3><p class="b">${P.blurb}</p>`;
    shownFor = k;
    requestAnimationFrame(() => requestAnimationFrame(() => note.classList.add("on")));
  }, shownFor < 0 ? 0 : 110);
}
hits.forEach((el, k) => {
  el.addEventListener("mouseenter", () => { hover = k; showNote(k); });
  el.addEventListener("mouseleave", () => { if (hover === k) { hover = -1; showNote(-1); } });
  el.addEventListener("focus", () => { hover = k; showNote(k); });
  el.addEventListener("blur", () => { if (hover === k) { hover = -1; showNote(-1); } });
});

track.style.height = "calc(100vh + 1800px)";
requestAnimationFrame(frame);
</script>
